apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: pycbc-live
spec:
  runPolicy:
    cleanPodPolicy: None
  runLauncherAsWorker: true
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: launcher
              image: pycbc-live:k8s
              imagePullPolicy: IfNotPresent
              env:
                - name: MPI_NP
                  value: "3"
                - name: MPI_HOST_ARGS
                  value: "--hostfile /etc/mpi/hostfile"
                - name: MPI_EXTRA_FLAGS
                  value: "--tag-output --timestamp-output --display-map --report-bindings"
              volumeMounts:
                - name: shared-workspace
                  mountPath: /workspace/tmp
              args:
                - /workspace/run.sh
          volumes:
            - name: shared-workspace
              persistentVolumeClaim:
                claimName: input-data
    Worker:
      replicas: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: pycbc-live:k8s
              imagePullPolicy: IfNotPresent
              volumeMounts:
                - name: shared-workspace
                  mountPath: /workspace/tmp
          volumes:
            - name: shared-workspace
              persistentVolumeClaim:
                claimName: input-data
