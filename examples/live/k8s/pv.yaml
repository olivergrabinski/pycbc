apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: input-data
spec:
  storageClassName: standard
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pvc-seeder
spec:
  restartPolicy: Never
  containers:
    - name: seeder
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - { name: input-data, mountPath: /workspace/tmp }
  volumes:
    - name: input-data
      persistentVolumeClaim:
        claimName: input-data
